# OpenSSF Scorecard - Security health metrics for the repository
# Purpose: Automated security analysis using OpenSSF Scorecard
# Docs: https://github.com/ossf/scorecard-action
#
# Version History
# | Version | Date       | Changes         |
# | ------- | ---------- | --------------- |
# | 1.0     | 2026-03-18 | Initial release |

name: OpenSSF Scorecard

on:
  # Run on pushes to main to track security posture over time
  push:
    branches: [main]
  # Weekly scan to catch drift
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 6:00 UTC

# Declare default permissions as read-only
permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Needed for Code Scanning upload
      security-events: write
      # Needed for GITHUB_TOKEN access
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.1
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish results to OpenSSF REST API
          publish_results: true

      - name: Upload Scorecard results to Code Scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif
