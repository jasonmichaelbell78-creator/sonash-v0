name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "CONTRIBUTING.md"
      - "CODE_OF_CONDUCT.md"
      - "SECURITY.md"
      - "LICENSE"
      - "release-notes.md"
      - "docs/archive/**"
      - "docs/SESSION_HISTORY.md"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "CONTRIBUTING.md"
      - "CODE_OF_CONDUCT.md"
      - "SECURITY.md"
      - "LICENSE"
      - "release-notes.md"
      - "docs/archive/**"
      - "docs/SESSION_HISTORY.md"
      - ".github/ISSUE_TEMPLATE/**"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Lint & Format (fast feedback) ─────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run oxlint (fast correctness check)
        run: npm run lint:fast

      - name: Run ESLint
        run: npm run lint

      - name: Check code formatting (Prettier)
        run: npm run format:check

      - name: Check for circular dependencies
        run: npm run deps:circular

      - name: Check for unused dependencies/exports
        run: npm run deps:unused

  # ── Job 1b: Functions Build (parallel with lint & test) ─────────
  functions:
    name: Functions Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        run: npm ci --ignore-scripts
        working-directory: functions

      - name: Lint Functions
        run: npm run lint
        working-directory: functions

      - name: Build Functions
        run: npm run build
        working-directory: functions

  # ── Job 2: Type Check & Test (parallel with lint) ────────────────
  test:
    name: Type Check & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type check
        run: npx tsc --noEmit

      - name: Build review scripts
        # Tests import from scripts/reviews/dist/ which is gitignored
        working-directory: scripts/reviews
        run: |
          npx tsc -p ./tsconfig.json
          test -d dist || { echo "::error::Expected scripts/reviews/dist to exist after build"; exit 1; }

      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          NODE_ENV: test
          GH_TOKEN: ${{ github.token }}
          NEXT_PUBLIC_FIREBASE_API_KEY: test
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: test
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: test
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: test
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: test
          NEXT_PUBLIC_FIREBASE_APP_ID: test

      - name: Enforce coverage thresholds
        run: |
          echo "Checking overall coverage threshold (65% line coverage)..."
          npx c8 check-coverage --lines 65 || {
            echo "::error::Overall line coverage below 65% threshold"
            exit 1
          }

      - name: Check test coverage completeness
        # Blocks if NEW untested scripts found (not in .test-baseline.json)
        # Known gaps in baseline are allowed; only new gaps fail CI
        run: node scripts/generate-test-registry.js --check-coverage

      - name: Pattern test suite
        run: npx vitest run tests/pattern-compliance.test.js

      - name: GitHub optimization wave tests
        run: node --test tests/scripts/github-optimization-wave3.test.js tests/scripts/github-optimization-wave4.test.js

      - name: Upload coverage to Codecov
        if: ${{ success() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        with:
          directory: coverage/
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage report
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # ── Job 2b: Emulator Rules (parallel with lint & test) ──────────
  rules:
    name: Firestore Rules Emulator Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java 21 for Firebase Emulator
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Verify Java runtime for Firebase Emulator
        run: java -version

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run Firestore rules tests
        run: npm run test:rules

  # ── Job 2c: Browser Smoke (parallel with lint & test) ───────────
  e2e:
    name: Browser Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:e2e
        env:
          CI: true
          NEXT_PUBLIC_FIREBASE_API_KEY: test
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: test
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: test
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: test
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: test
          NEXT_PUBLIC_FIREBASE_APP_ID: test
          NEXT_PUBLIC_FIREBASE_APPCHECK_RECAPTCHA_SITE_KEY: test

  # ── Job 3: Validate (parallel with lint & test) ──────────────────
  validate:
    name: Validate & Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Get changed files for pattern check
        if: ${{ github.event_name == 'pull_request' }}
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            **/*.js
            **/*.ts
            **/*.tsx
            **/*.jsx
            **/*.sh
            **/*.yml
            **/*.yaml
            .husky/**
          separator: " "

      - name: Pattern compliance check (PR - changed files only)
        if: ${{ github.event_name == 'pull_request' && steps.changed-files.outputs.any_changed == 'true' }}
        run: |
          echo "Checking pattern compliance on changed files..."
          echo "Files to check: ${{ steps.changed-files.outputs.all_changed_files }}"
          # Use -- to prevent filenames starting with - from being interpreted as options
          node scripts/check-pattern-compliance.js -- ${{ steps.changed-files.outputs.all_changed_files }}

      - name: Pattern compliance check (PR - no relevant files changed)
        if: ${{ github.event_name == 'pull_request' && steps.changed-files.outputs.any_changed != 'true' }}
        run: echo "No pattern-checkable files changed, skipping pattern compliance"

      - name: Pattern compliance check (push to main)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        # Blocking: baseline verified clean before enabling (PR #457)
        run: npm run patterns:check-all

      - name: Security pattern check
        run: node scripts/security-check.js --all

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Documentation check
        # Non-blocking: templates/stubs have expected issues, active docs are clean
        continue-on-error: true
        run: npm run docs:check

      - name: Validate CANON schema
        # Validates all CANON*.jsonl files have correct structure
        run: npm run validate:canon

      - name: Validate audit files
        # Validates audit JSONL files have required fields
        continue-on-error: true
        run: npm run audit:validate -- --all

      - name: Validate technical debt schema
        # TDMS Phase 8: Validates MASTER_DEBT.jsonl has correct structure
        if: ${{ hashFiles('docs/technical-debt/MASTER_DEBT.jsonl') != '' }}
        run: node scripts/debt/validate-schema.js

      - name: Check ROADMAP debt references
        # TDMS Phase 8: Validates DEBT-XXXX references exist in canonical source
        if: ${{ hashFiles('docs/technical-debt/MASTER_DEBT.jsonl') != '' }}
        run: node scripts/debt/sync-roadmap-refs.js --check-only

      - name: Verify technical debt views current
        # TDMS Phase 8: Ensures generated views match MASTER_DEBT.jsonl
        if: ${{ hashFiles('docs/technical-debt/MASTER_DEBT.jsonl') != '' }}
        continue-on-error: true
        run: |
          node scripts/debt/generate-views.js
          git diff --exit-code docs/technical-debt/views/ || echo "⚠️ Views are stale - run: node scripts/debt/generate-views.js"

  # ── Job 4: Build (depends on lint + test passing) ────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, test, validate, functions, rules, e2e]
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
