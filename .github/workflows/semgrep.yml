name: Semgrep

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE"
      - "CONTRIBUTING.md"
      - "CODE_OF_CONDUCT.md"
      - "SECURITY.md"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE"
      - "CONTRIBUTING.md"
      - "CODE_OF_CONDUCT.md"
      - "SECURITY.md"
  schedule:
    - cron: "17 13 * * 3"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    permissions:
      contents: read
      security-events: write
      actions: read
    name: Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Semgrep
        run: pip install semgrep==1.67.0

      # Run local custom rules from .semgrep/rules/
      # No --error flag: findings are informational (uploaded via SARIF).
      - name: Run local custom rules
        run: |
          semgrep --config .semgrep/rules/ \
            --sarif \
            --output=semgrep-local.sarif \
            . || true

      # Test Semgrep rules against annotation files
      - name: Test Semgrep rules
        if: always()
        run: |
          semgrep --test \
            --config .semgrep/rules/ \
            tests/semgrep/

      - name: Verify SARIF output exists
        if: always()
        run: test -s semgrep-local.sarif || { echo "::error::semgrep-local.sarif missing or empty — Semgrep scan may have failed silently"; exit 1; }

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        if: always() && hashFiles('semgrep-local.sarif') != ''
        with:
          sarif_file: semgrep-local.sarif
          category: semgrep-local
